<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Komunikaty</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=1.3.5">

  <link rel="icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0f172a">
</head>

<body class="app">

  <!-- NAGŁÓWEK -->
  <header class="topbar">
    <div class="topbar__inner topbar__inner--logo">
      <img class="topbar__logo" src="logo.webp?v=3" alt="m.komunikaty">
    </div>
  </header>

  <!-- ZAWARTOŚĆ -->
  <main class="app__content">

    <!-- GŁÓWNE PRZEŁĄCZANIE JĘZYKA -->
    <div class="tabs" role="tablist" aria-label="Wybór języka">
      <button
        id="tabPL"
        class="tab active"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="sectionPL"
        data-lang-switch="pl">
        🇵🇱 Polski
      </button>

      <button
        id="tabEN"
        class="tab"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="sectionEN"
        data-lang-switch="en">
        🇬🇧 English
      </button>
    </div>

    <!-- PANEL NARZĘDZI: SZUKANIE + ULUBIONE -->
    <section class="tools-panel" aria-label="Narzędzia">
      <div class="search-box">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="Szukaj komunikatu..."
          aria-label="Szukaj komunikatu">
      </div>

      <button
        id="favoritesToggle"
        class="favorites-toggle"
        type="button"
        aria-pressed="false">
        ☆ Ulubione
      </button>
    </section>

    <!-- KOMUNIKAT BRAKU WYNIKÓW -->
    <div id="emptyState" class="empty-state" hidden>
      Brak pasujących komunikatów.
    </div>

    <div class="accordion-container" id="announcementsRoot">

      <!-- SEKCJA: POLSKI -->
      <section
        id="sectionPL"
        class="section active"
        data-lang="pl"
        aria-labelledby="tabPL">

        <div class="load-slot" data-load="pl/komunikat1.html" data-lang="pl" data-announcement="1"></div>
        <div class="load-slot" data-load="pl/komunikat2.html" data-lang="pl" data-announcement="2"></div>
        <div class="load-slot" data-load="pl/komunikat3.html" data-lang="pl" data-announcement="3"></div>
        <div class="load-slot" data-load="pl/komunikat4.html" data-lang="pl" data-announcement="4"></div>
        <div class="load-slot" data-load="pl/komunikat5.html" data-lang="pl" data-announcement="5"></div>
        <div class="load-slot" data-load="pl/komunikat6.html" data-lang="pl" data-announcement="6"></div>
        <div class="load-slot" data-load="pl/komunikat7.html" data-lang="pl" data-announcement="7"></div>
        <div class="load-slot" data-load="pl/komunikat8.html" data-lang="pl" data-announcement="8"></div>
        <div class="load-slot" data-load="pl/komunikat9.html" data-lang="pl" data-announcement="9"></div>
        <div class="load-slot" data-load="pl/uwaga.html" data-lang="pl" data-announcement="uwaga"></div>

      </section>

      <!-- SEKCJA: ENGLISH -->
      <section
        id="sectionEN"
        class="section"
        data-lang="en"
        aria-labelledby="tabEN">

        <div class="load-slot" data-load="en/announcement1.html" data-lang="en" data-announcement="1"></div>
        <div class="load-slot" data-load="en/announcement2.html" data-lang="en" data-announcement="2"></div>
        <div class="load-slot" data-load="en/announcement3.html" data-lang="en" data-announcement="3"></div>
        <div class="load-slot" data-load="en/announcement4.html" data-lang="en" data-announcement="4"></div>
        <div class="load-slot" data-load="en/announcement5.html" data-lang="en" data-announcement="5"></div>
        <div class="load-slot" data-load="en/announcement6.html" data-lang="en" data-announcement="6"></div>
        <div class="load-slot" data-load="en/announcement7.html" data-lang="en" data-announcement="7"></div>
        <div class="load-slot" data-load="en/announcement8.html" data-lang="en" data-announcement="8"></div>
        <div class="load-slot" data-load="en/announcement9.html" data-lang="en" data-announcement="9"></div>
        <div class="load-slot" data-load="en/note.html" data-lang="en" data-announcement="note"></div>

      </section>

    </div>
  </main>

  <!-- STOPKA -->
  <footer class="footerbar" id="gc-footer">
    <div class="footerbar__inner">

      <div class="footerbar__meta" aria-label="Informacje o wersji">
        <span class="footerbar__metaName">m.komunikaty</span>
        <span class="footerbar__dot" aria-hidden="true">•</span>
        <span>powered by ab: <span id="createdDate">2026-01-14</span></span>
        <span class="footerbar__dot" aria-hidden="true">•</span>
        <span>Wersja: <span id="appVersion">v1.3.5</span></span>
      </div>

      <div class="footerbar__counters" aria-label="Statystyki odsłon">
        <span class="chip chip--soft">Odsłony: łącznie <span id="gc-total">–</span></span>
        <span class="chip chip--soft">dziś <span id="gc-today">–</span></span>
        <span class="chip chip--soft">ostatnie 7 dni <span id="gc-7d">–</span></span>
      </div>

    </div>
  </footer>

  <!-- PŁYWAJĄCY PRZEŁĄCZNIK JĘZYKA -->
  <button id="langFab" class="lang-fab" type="button" aria-label="Przełącz język">EN</button>

  <script src="script.js?v=1.3.5"></script>

  <script
    data-goatcounter="https://komunikaty.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js"></script>

  <script>
    const CREATED = "2026-01-14";
    const VERSION = "v1.3.5";

    document.getElementById("createdDate").textContent = CREATED;
    document.getElementById("appVersion").textContent = VERSION;

    const GC = "https://komunikaty.goatcounter.com";
    const KEY = "gc_counts_cache_v3";
    const GC_PATH = "/komunikaty-pociag/";
    const TOTAL_OFFSET = 100;

    function ymd(d) {
      const pad = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }

    function formatCount(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return value;
      return n.toLocaleString("pl-PL");
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = formatCount(value);
    }

    function loadCache() {
      try {
        return JSON.parse(localStorage.getItem(KEY) || "null");
      } catch {
        return null;
      }
    }

    function saveCache(obj) {
      try {
        localStorage.setItem(KEY, JSON.stringify(obj));
      } catch {}
    }

    async function gcCount(path, start = null, end = null) {
      const p = encodeURIComponent(path);
      let url = `${GC}/counter/${p}.json`;
      const qs = [];

      if (start) qs.push(`start=${encodeURIComponent(start)}`);
      if (end) qs.push(`end=${encodeURIComponent(end)}`);
      qs.push(`_=${Date.now()}`);

      url += `?${qs.join("&")}`;

      const r = await fetch(url, { cache: "no-store", mode: "cors" });
      if (!r.ok) throw new Error("GoatCounter HTTP " + r.status);

      const data = await r.json();
      return Number(data.count || 0);
    }

    async function gcCountWithFallback(start = null, end = null) {
      const paths = [
        GC_PATH,
        "/komunikaty-pociag",
        "/komunikaty-pociag/",
        "/",
        "/komunikaty",
        "/komunikaty/",
        "TOTAL",
        "/TOTAL"
      ];

      let lastError = null;

      for (const path of paths) {
        try {
          const count = await gcCount(path, start, end);
          if (Number.isFinite(count)) return count;
        } catch (e) {
          lastError = e;
        }
      }

      throw lastError || new Error("GoatCounter failed");
    }

    (async () => {
      const cached = loadCache();

      if (cached && typeof cached === "object") {
        if (cached.total != null) setText("gc-total", cached.total);
        if (cached.today != null) setText("gc-today", cached.today);
        if (cached.d7 != null) setText("gc-7d", cached.d7);
      }

      try {
        const today = new Date();
        const startToday = ymd(today);

        const d7 = new Date(today);
        d7.setDate(d7.getDate() - 7);

        const rawTotal = await gcCountWithFallback();
        const rawToday = await gcCountWithFallback(startToday);
        const rawD7 = await gcCountWithFallback(ymd(d7));

        const total = rawTotal + TOTAL_OFFSET;
        const todayCount = rawToday;
        const d7Count = rawD7;

        setText("gc-total", total);
        setText("gc-today", todayCount);
        setText("gc-7d", d7Count);

        saveCache({
          total,
          today: todayCount,
          d7: d7Count,
          rawTotal,
          offset: TOTAL_OFFSET,
          path: GC_PATH,
          version: VERSION,
          ts: Date.now()
        });
      } catch (e) {
        console.warn("GoatCounter counter failed:", e);

        const cached2 = loadCache();
        if (!cached2) {
          setText("gc-total", "–");
          setText("gc-today", "–");
          setText("gc-7d", "–");
        }
      }
    })();
  </script>

</body>
</html>
