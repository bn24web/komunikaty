      </div>

      <div class="footerbar__counters" aria-label="Statystyki odsłon">
        <span class="chip chip--soft">Odsłony: łącznie <span id="gc-total">–</span></span>
        <span class="chip chip--soft">dziś <span id="gc-today">–</span></span>
        <span class="chip chip--soft">ostatnie 7 dni <span id="gc-7d">–</span></span>

  <!-- PŁYWAJĄCY PRZEŁĄCZNIK JĘZYKA -->
  <button id="langFab" class="lang-fab" type="button" aria-label="Przełącz język">EN</button>

  <script src="script.js?v=1.2.3"></script>

  <script
    data-goatcounter="https://komunikaty.goatcounter.com/count"
    async
    src="https://gc.zgo.at/count.js"></script>

  <script>
    const CREATED = "2026-01-14";
    const VERSION = "v1.2.3";

    document.getElementById("createdDate").textContent = CREATED;
    document.getElementById("appVersion").textContent = VERSION;

    const GC = "https://komunikaty.goatcounter.com";
    const KEY = "gc_counts_cache_v3";

    /*
      Strona GitHub Pages:
      https://vibeostm.github.io/komunikaty-pociag/

      GoatCounter zwykle zapisuje ścieżkę jako:
      /komunikaty-pociag/
    */
    const GC_PATH = "/komunikaty-pociag/";

    /*
      Licznik startowy.
      GoatCounter liczy realne odwiedziny od nowej domeny,
      a na stronie pokazujemy łączną liczbę jako realne odwiedziny + 100.
    */
    const TOTAL_OFFSET = 100;

    function ymd(d) {
      const pad = (n) => String(n).padStart(2, "0");
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }

    function formatCount(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return value;
      return n.toLocaleString("pl-PL");
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = formatCount(value);
    }

    function loadCache() {
      try {
        return JSON.parse(localStorage.getItem(KEY) || "null");
      } catch {
        return null;
      }
    }

    function saveCache(obj) {
      try {
        localStorage.setItem(KEY, JSON.stringify(obj));
      } catch {}
    }

    async function gcCount(path, start = null, end = null) {
      const p = encodeURIComponent(path);
      let url = `${GC}/counter/${p}.json`;
      const qs = [];

      if (start) qs.push(`start=${encodeURIComponent(start)}`);
      if (end) qs.push(`end=${encodeURIComponent(end)}`);
      qs.push(`_=${Date.now()}`);

      url += `?${qs.join("&")}`;

      const r = await fetch(url, { cache: "no-store", mode: "cors" });
      if (!r.ok) throw new Error("GoatCounter HTTP " + r.status);

      const data = await r.json();
      return Number(data.count || 0);
    }

    async function gcCountWithFallback(start = null, end = null) {
      const paths = [
        GC_PATH,
        "/komunikaty-pociag",
        "/komunikaty-pociag/",
        "/",
        "/komunikaty",
        "/komunikaty/",
        "TOTAL",
        "/TOTAL"
      ];

      let lastError = null;

      for (const path of paths) {
        try {
          const count = await gcCount(path, start, end);

          /*
            Zwracamy pierwszy poprawny wynik.
            Jeżeli GoatCounter zwraca 0, to też jest poprawny wynik,
            bo strona może być świeża albo filtr dat może nie mieć odsłon.
          */
          if (Number.isFinite(count)) {
            return count;
          }
        } catch (e) {
          lastError = e;
        }
      }

      throw lastError || new Error("GoatCounter failed");
    }

    (async () => {
      const cached = loadCache();

      if (cached && typeof cached === "object") {
        if (cached.total != null) setText("gc-total", cached.total);
        if (cached.today != null) setText("gc-today", cached.today);
        if (cached.d7 != null) setText("gc-7d", cached.d7);
      }

      try {
        const today = new Date();
        const startToday = ymd(today);

        const d7 = new Date(today);
        d7.setDate(d7.getDate() - 7);

        const rawTotal = await gcCountWithFallback();
        const rawToday = await gcCountWithFallback(startToday);
        const rawD7 = await gcCountWithFallback(ymd(d7));

        const total = rawTotal + TOTAL_OFFSET;
        const todayCount = rawToday;
        const d7Count = rawD7;

        setText("gc-total", total);
        setText("gc-today", todayCount);
        setText("gc-7d", d7Count);

        saveCache({
          total,
          today: todayCount,
          d7: d7Count,
          rawTotal,
          offset: TOTAL_OFFSET,
          path: GC_PATH,
          version: VERSION,
          ts: Date.now()
        });
      } catch (e) {
        console.warn("GoatCounter counter failed:", e);

        const cached2 = loadCache();
        if (!cached2) {
          setText("gc-total", "–");
          setText("gc-today", "–");
          setText("gc-7d", "–");
        }
      }
    })();
  </script>

</body>
</html>
